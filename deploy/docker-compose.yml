services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in your environment}
    ports:
      - '1433:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q 'SELECT 1' || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  sqlserver-data:
