name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify layer boundaries
        run: ./scripts/check-layering.sh
      - name: Run unit tests
        run: go test -race -short ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/penbun-api .
