$kind: http-request
description: |-
  201 · เขียน tb_product + tb_book ในทรานแซกชันเดียว (UQ_tb_book_product บังคับ 1:1).
  product_name ยึดตาม book_name ถ้าไม่ระบุแยก. count_stock ถูกตั้งเป็น true เสมอ ส่งมาเองไม่ได้.
  'book_description' map ไป tb_book.description ส่วน 'description' ไป tb_product.description

  ⚠ QC: อย่าส่ง 'translator' — descriptor ประกาศไว้แต่ tb_book ของ v7 ไม่มีคอลัมน์นี้ จะได้ 500 (SQL error 207)
url: "{{api}}/book"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
