$kind: http-request
description: 200 · envelope data = {items, page, limit, total, total_pages}
url: "{{api}}/route?page=1&limit=50"
method: GET
queryParams:
  - key: page
    value: "1"
    disabled: false
    description: หน้าที่ (>=1)
  - key: limit
    value: "50"
    disabled: false
    description: จำนวนต่อหน้า (1-200, clamp)
  - key: q
    value: ""
    disabled: true
    description: ค้นหาแบบ LIKE ใน SearchColumns
  - key: sort
    value: code
    disabled: true
    description: code | name | order | updated  (นำหน้าด้วย - เพื่อเรียงจากมากไปน้อย)
  - key: is_active
    value: "true"
    disabled: true
    description: true | false
  - key: route_type
    value: REGION
    disabled: true
    description: LEGACY_LINE | REGION | DAILY
  - key: warehouse_id
    value: "{{warehouse_id}}"
    disabled: true
    description: ""
order: 1000
