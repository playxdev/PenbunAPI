$kind: http-request
description: 200 · envelope data = {items, page, limit, total, total_pages}
url: "{{api}}/product?page=1&limit=50"
method: GET
queryParams:
  - key: page
    value: "1"
    disabled: false
    description: หน้าที่ (>=1)
  - key: limit
    value: "50"
    disabled: false
    description: จำนวนต่อหน้า (1-200, clamp)
  - key: q
    value: ""
    disabled: true
    description: ค้นหาแบบ LIKE ใน SearchColumns
  - key: sort
    value: name
    disabled: true
    description: name | code | updated  (นำหน้าด้วย - เพื่อเรียงจากมากไปน้อย)
  - key: is_active
    value: "true"
    disabled: true
    description: true | false
  - key: product_category_id
    value: "{{product_category_id}}"
    disabled: true
    description: ""
  - key: product_group_id
    value: "{{product_group_id}}"
    disabled: true
    description: ""
  - key: vendor_id
    value: "{{vendor_id}}"
    disabled: true
    description: ""
  - key: count_stock
    value: "true"
    disabled: true
    description: true | false
order: 1000
