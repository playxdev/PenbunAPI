$kind: http-request
description: |-
  ต้องมี Bearer token. ตอบ 204 ไม่มี body
  ⚠ บน Vercel รายการเพิกถอนเก็บในหน่วยความจำของแต่ละ instance — token เดิมยังใช้ได้ที่ instance อื่น
url: "{{api}}/auth/logout"
method: POST
headers:
  x-vercel-protection-bypass: "{{vercel_bypass}}"
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('logout returns 204', () => pm.response.to.have.status(204));
      pm.collectionVariables.set('access_token', '');
      pm.collectionVariables.set('refresh_token', '');
    language: text/javascript
order: 2000
